<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FAF8F6" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#121A21" media="(prefers-color-scheme: dark)" />
  <title>Qubirex — Your Language. Your Skills. Your Future</title>
  <meta name="description" content="Learn in Telugu, Hindi or English. Prove what you can do with a signed Capability Passport. Get hired on proof. By Inferexaa Private Limited, Hyderabad." />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/brand/qubirex-mark-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/brand/qubirex-mark-16.png" />
  <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Qubirex" />
  <meta property="og:title" content="Qubirex — Your Language. Your Skills. Your Future" />
  <meta property="og:description" content="Learn in your language. Prove what you can do. Get hired on proof." />
  <meta property="og:image" content="/brand/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="/brand/og-image.png" />
  <!-- Self-hosted fonts (no Google Fonts): Outfit headings, Anek body in all three scripts. -->
  <link rel="preload" href="/fonts/anek-latin-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/outfit-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/fonts/fonts.css" />
  <script>
    // Applied before paint: no light-mode flash on a saved dark session, and
    // the page language matches the saved interface language.
    try {
      var t = localStorage.getItem('qubirex_theme');
      document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
      var l = localStorage.getItem('qubirex_ui_lang');
      document.documentElement.setAttribute('lang', l === 'telugu' ? 'te' : l === 'hindi' ? 'hi' : 'en');
      // Preload the script font for the saved language so Telugu/Hindi never flash as broken glyphs.
      var f = l === 'telugu' ? 'anek-telugu-telugu-400-normal' : l === 'hindi' ? 'anek-devanagari-devanagari-400-normal' : null;
      if (f) { var k = document.createElement('link'); k.rel = 'preload'; k.as = 'font'; k.type = 'font/woff2'; k.crossOrigin = ''; k.href = '/fonts/' + f + '.woff2'; document.head.appendChild(k); }
    } catch (e) {}
  </script>
</head>
<body>
  <noscript>Qubirex needs JavaScript to run.</noscript>
  <div id="root"></div>
</body>
</html>

<!doctype html>
<html><head><meta charset="utf-8">
<!-- A motion-graphics pitch drawn frame by frame (window.render(t)) from
     window.STORY = { beats, sections, total, footage }. Original artwork only:
     section titles, floating bubbles, animated numbers with sources, product
     footage in a device frame (the whole screen, never cropped), close. -->
<style>
  @font-face { font-family: Outfit; src: url('../../../frontend/public/fonts/outfit-latin-600-normal.woff2'); font-weight: 600; }
  @font-face { font-family: Outfit; src: url('../../../frontend/public/fonts/outfit-latin-700-normal.woff2'); font-weight: 700; }
  @font-face { font-family: Anek; src: url('../../../frontend/public/fonts/anek-latin-latin-500-normal.woff2'); font-weight: 500; }
  @font-face { font-family: Anek; src: url('../../../frontend/public/fonts/anek-latin-latin-600-normal.woff2'); font-weight: 600; }
  @font-face { font-family: 'Anek Telugu'; src: url('../../../frontend/public/fonts/anek-telugu-telugu-600-normal.woff2'); font-weight: 600; }
  @font-face { font-family: 'Anek Telugu'; src: url('../../../frontend/public/fonts/anek-telugu-telugu-700-normal.woff2'); font-weight: 700; }
  @font-face { font-family: 'Anek Devanagari'; src: url('../../../frontend/public/fonts/anek-devanagari-devanagari-600-normal.woff2'); font-weight: 600; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #15110F; }
  body { font-family: Anek, 'Anek Telugu', 'Anek Devanagari', sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
  .d { text-wrap: balance; font-family: Outfit, 'Anek Telugu', 'Anek Devanagari', sans-serif; letter-spacing: -0.02em; }
  .abs { position: absolute; }
  #stage { position: absolute; inset: 0; overflow: hidden; }
  #bg, #bubbles { position: absolute; inset: 0; }
  .bub { position: absolute; border-radius: 50%; filter: blur(2px); }
  .beat { position: absolute; inset: 0; visibility: hidden; }
  .src { position: absolute; left: 120px; bottom: 70px; font-size: 26px; font-weight: 600; letter-spacing: .04em; opacity: .75; }
  .big { font-family: Outfit, 'Anek Telugu', sans-serif; font-weight: 700; letter-spacing: -0.03em; }
  .label { font-size: 46px; font-weight: 600; }
  /* Section title: big wipe-in, then it moves to a chip at the top left. */
  #sec { position: absolute; left: 0; top: 0; transform-origin: 0 0; white-space: nowrap; }
  #sec .n { font-family: Outfit, sans-serif; font-weight: 700; color: #F89833; }
  #sec .t { font-family: Outfit, 'Anek Telugu', sans-serif; font-weight: 700; }
  #secLine { position: absolute; height: 8px; border-radius: 4px; background: linear-gradient(90deg, #BC1F3D, #E73B2B, #F89833); }
  .device { position: absolute; left: 560px; top: 150px; width: 1280px; height: 840px; border-radius: 22px; background: #15151a; box-shadow: 0 60px 120px rgba(60,20,10,.32); overflow: hidden; }
  .device .bar { height: 40px; background: #1d1d22; display: flex; gap: 10px; align-items: center; padding-left: 18px; }
  .device .bar i { width: 13px; height: 13px; border-radius: 50%; background: #444; display: block; }
  .device .screen { position: relative; width: 1280px; height: 800px; overflow: hidden; background: #fff; }
  .device img { position: absolute; left: 0; top: 0; width: 1280px; height: 800px; }
  /* A blank the founder still has to fill: visible, never invented. */
  .fill { color: #F89833; border: 3px dashed #F89833; border-radius: 10px; padding: 0 .25em; font-weight: 700; }
  .illus { position: absolute; left: 110px; top: 980px; font-size: 26px; font-weight: 600; letter-spacing: .06em; color: #FFD9B0; background: rgba(248,152,51,.16); border: 1px solid rgba(248,152,51,.45); padding: 6px 16px; border-radius: 999px; }
  .device .tag { margin-left: auto; margin-right: 16px; font-size: 20px; font-weight: 600; letter-spacing: .08em; color: #FFD9B0; background: rgba(248,152,51,.18); border: 1px solid rgba(248,152,51,.45); padding: 3px 12px; border-radius: 999px; }
  .kicker { position: absolute; width: 360px; color: var(--ink); text-wrap: balance; font-family: Outfit, 'Anek Telugu', sans-serif; font-weight: 700; color: var(--ink); font-size: 50px; line-height: 1.06; }
  .kicker small { display: block; font-size: 26px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: #E73B2B; margin-bottom: 14px; }
  .card { position: absolute; border-radius: 28px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16); backdrop-filter: blur(6px); }
  .chip { position: absolute; padding: 18px 42px; border-radius: 999px; font-size: 52px; font-weight: 600; background: #fff; color: #C4302A; box-shadow: 0 20px 50px rgba(0,0,0,.25); white-space: nowrap; }
  .word { position: absolute; font-family: Outfit, sans-serif; font-weight: 600; color: #F3E9E1; white-space: nowrap; }
</style></head>
<body><div id="stage">
  <div id="bg"></div><div id="bubbles"></div>
  <div id="beats"></div>
  <div id="secLine"></div>
  <div id="sec"><span class="n"></span> <span class="t"></span></div>
</div>
<script>
const { beats: BEATS, sections: SECTIONS, total: TOTAL, footage: FOOTAGE } = window.STORY;
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const p = (t, a, b) => clamp((t - a) / (b - a));
const eo = (x) => 1 - (1 - x) ** 3;
const eio = (x) => (x < .5 ? 4 * x * x * x : 1 - (-2 * x + 2) ** 3 / 2);
const back = (x) => { const c = 1.6; return 1 + (c + 1) * (x - 1) ** 3 + c * (x - 1) ** 2; };
const vis = (el, o) => { el.style.opacity = o; el.style.visibility = o > 0.001 ? 'visible' : 'hidden'; };
const html = (s) => { const d = document.createElement('div'); d.innerHTML = s.trim(); return d.firstChild; };
const fmt = (v, dec) => v.toLocaleString('en-IN', { minimumFractionDigits: dec, maximumFractionDigits: dec });
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

// ── Themes and background bubbles ──
const THEME = {
  dark: { bg: 'radial-gradient(1300px 900px at 50% 55%, #1F1916, #15110F)', ink: '#fff', soft: '#BEB4AC', bub: ['rgba(231,59,43,.22)', 'rgba(248,152,51,.18)', 'rgba(242,106,33,.14)'] },
  warm: { bg: 'radial-gradient(1500px 1000px at 50% 60%, #F89833, #E73B2B 50%, #BC1F3D 85%)', ink: '#fff', soft: '#FFE3C4', bub: ['rgba(255,255,255,.22)', 'rgba(255,220,180,.25)', 'rgba(255,255,255,.12)'] },
  light: { bg: 'radial-gradient(1500px 900px at 80% 110%, rgba(248,152,51,.28), transparent 60%), radial-gradient(1000px 800px at 0% -10%, rgba(231,59,43,.12), transparent 60%), #FFF6F0', ink: '#1b1b1f', soft: '#5d5d68', bub: ['rgba(231,59,43,.10)', 'rgba(248,152,51,.14)', 'rgba(188,31,61,.08)'] },
  close: { bg: 'radial-gradient(1200px 800px at 50% 45%, #2b1519, #15110F)', ink: '#fff', soft: '#FFD9B0', bub: ['rgba(248,152,51,.18)', 'rgba(231,59,43,.18)', 'rgba(255,255,255,.08)'] }
};
// One background for the whole video (brand.json "background": A | B | C), no
// bokeh, no blue. Product scenes keep it too: the white product card stands out.
const BGS = {
  A: { bg: 'radial-gradient(1100px 800px at 90% 95%, rgba(242,106,33,.27), transparent 70%), radial-gradient(900px 700px at 6% 4%, rgba(200,40,30,.16), transparent 70%), #15110F', ink: '#FFFFFF', soft: '#BEB4AC', bub: ['transparent', 'transparent', 'transparent'] },
  B: { bg: 'radial-gradient(1100px 800px at 90% 95%, rgba(242,106,33,.16), transparent 70%), #FBF6EF', ink: '#1F1A17', soft: '#6E5F57', bub: ['transparent', 'transparent', 'transparent'] },
  C: { bg: 'radial-gradient(1100px 800px at 85% 92%, rgba(226,59,45,.32), transparent 70%), radial-gradient(900px 700px at 8% 6%, rgba(242,106,33,.14), transparent 70%), #1E0A09', ink: '#FFFFFF', soft: '#E8C9B8', bub: ['transparent', 'transparent', 'transparent'] }
};
const SEL = BGS[window.STORY.background || 'A'] || BGS.A;
Object.keys(THEME).forEach((k) => { THEME[k] = SEL; });
document.documentElement.style.setProperty('--ink', SEL.ink); document.documentElement.style.setProperty('--soft', SEL.soft);
const BUBS = Array.from({ length: 0 }, (_, i) => ({ x: rnd() * 1920, y: rnd() * 1080, r: 40 + rnd() * 190, v: 10 + rnd() * 26, ph: rnd() * 6, c: i % 3 }));
BUBS.forEach(() => $('bubbles').appendChild(html('<div class="bub"></div>')));
const bubEls = [...document.querySelectorAll('.bub')];
const sectionAt = (t) => SECTIONS.filter(s => s.start <= t).pop() || SECTIONS[0];

// ── Beat builders: each returns update(t, b) ──
// On-screen words: English by default; a story can replace any of them (window.STORY.strings).
const S = (k, d) => ((window.STORY.strings || {})[k] ?? d);
// [FILL: …] and [website] blanks render as visible orange placeholders.
const F = (s) => String(s ?? '').replace(/\[(FILL:[^\]]*|website)\]/g, (m) => `<span class="fill">${m}</span>`);
const SRC = (b) => (b.source ? `<div class="src">${S('source', 'Source:')} ${b.source}</div>` : '');
// A section's first beat waits until the big section title has shrunk to its
// corner chip (done at +1.45 s): one title on screen at a time.
const TITLED = (b) => b.first && SECTIONS.some(s => s.id === b.section && s.title);
const ENTER = (b) => b.start + (TITLED(b) ? 1.55 : 0.02);
const B = {};

B.stat = (el, b) => {
  // Telugu units have letters that hang below the line: give them room.
  const low = /[^\x00-\x7F]/.test(b.suffix || '') ? 50 : 0;
  const wide = /[^\x00-\x7F]/.test(b.suffix || '');
  el.innerHTML = `<div class="abs big" style="left:0;right:0;top:330px;text-align:center;font-size:250px" data-n><span data-num></span><span${wide ? ' style="font-size:.55em"' : ''}>${b.suffix || ''}</span></div>
    <div class="abs label" style="left:0;right:0;top:${660 + low}px;text-align:center" data-l>${F(b.label)}</div>
    <div class="abs" style="left:660px;top:${610 + low}px;height:10px;border-radius:5px;background:linear-gradient(90deg,#BC1F3D,#E73B2B,#F89833)" data-ring></div>${SRC(b)}`;
  const n = el.querySelector('[data-n]'); const ring = el.querySelector('[data-ring]'); const l = el.querySelector('[data-l]');
  return (t) => { const a = ENTER(b); const k = eo(p(t, a, a + 1.3)); n.querySelector('[data-num]').textContent = fmt(b.value * k, b.decimals); ring.style.width = `${600 * eo(p(t, a + .2, a + 1.2))}px`; vis(l, eo(p(t, a - .05, a + .25))); }; // the label is there from the count-up's first frame
};
const CAP = '<svg viewBox="0 0 100 100" width="130" height="130"><path d="M50 18 L96 38 L50 58 L4 38Z" fill="currentColor"/><path d="M24 48 V68 C24 80 76 80 76 68 V48 L50 60Z" fill="currentColor" opacity=".85"/><rect x="88" y="38" width="5" height="32" fill="currentColor"/></svg>';
B.caps = (el, b) => {
  el.innerHTML = `<div class="abs" style="left:310px;top:330px;width:1300px;display:flex;justify-content:space-between" data-row>${Array.from({ length: 10 }, () => `<span style="position:relative;display:block;width:130px;height:130px"><span style="position:absolute;inset:0;color:#4A3F39">${CAP}</span><span data-fill style="position:absolute;inset:0;color:#F89833;clip-path:inset(0 100% 0 0)">${CAP}</span></span>`).join('')}</div>
    <div class="abs big" style="left:0;right:0;top:520px;text-align:center;font-size:150px" data-n></div>
    <div class="abs label" style="left:0;right:0;top:700px;text-align:center">${b.label}</div>${SRC(b)}`;
  const icons = [...el.querySelectorAll('[data-row] > span')]; const n = el.querySelector('[data-n]');
  return (t) => { const a = ENTER(b); const k = eo(p(t, a, a + 1.6)); const lit = (b.pct / 10) * k; icons.forEach((s, i) => { const f = clamp(lit - i); s.querySelector('[data-fill]').style.clipPath = `inset(0 ${100 - 100 * f}% 0 0)`; s.style.transform = `translateY(${-back(p(t, a + i * .08, a + i * .08 + .5)) * 14 + 14}px)`; }); n.textContent = `${Math.round(b.pct * k)}%`; };
};
const PERSON = '<svg viewBox="0 0 60 120" width="96" height="190"><circle cx="30" cy="22" r="18" fill="currentColor"/><path d="M6 120 V62 C6 46 54 46 54 62 V120Z" fill="currentColor"/></svg>';
B.people = (el, b) => {
  el.innerHTML = `<div class="abs" style="left:300px;top:300px;width:1320px;display:flex;justify-content:space-between" data-row>${Array.from({ length: 10 }, () => `<span style="color:#4A3F39">${PERSON}</span>`).join('')}</div>
    <div class="abs big" style="left:0;right:0;top:560px;text-align:center;font-size:120px" data-n>${b.big || S('oneInTen', '1 in 10')}</div>
    <div class="abs label" style="left:0;right:0;top:710px;text-align:center">${b.label}</div>
    <div class="abs d" style="left:0;right:0;top:800px;text-align:center;font-size:58px;font-weight:700;color:#FFD27A" data-y>${S('yetEnglish', 'Yet engineering is taught in English.')}</div>${SRC(b)}`;
  const icons = [...el.querySelectorAll('[data-row] span')]; const n = el.querySelector('[data-n]'); const y = el.querySelector('[data-y]');
  return (t) => { const a = ENTER(b); icons.forEach((s, i) => { s.style.transform = `translateY(${(1 - back(p(t, a + i * .05, a + i * .05 + .5))) * 60}px)`; s.style.color = i === 0 && t > a + .9 ? '#F89833' : '#4A3F39'; vis(s, eo(p(t, a + i * .05, a + i * .05 + .3))); }); vis(n, eo(p(t, a + .9, a + 1.3))); n.style.transform = `scale(${.8 + .2 * back(p(t, a + .9, a + 1.4))})`; vis(y, eo(p(t, b.start + (b.end - b.start) * .42, b.start + (b.end - b.start) * .42 + .4))); y.style.transform = `translateY(${(1 - eo(p(t, b.start + (b.end - b.start) * .42, b.start + (b.end - b.start) * .42 + .5))) * 30}px)`; };
};
B.bars = (el, b) => {
  const max = Math.max(...b.rows.map(r => r[1]));
  el.innerHTML = `<div class="abs label" style="left:300px;top:250px;font-size:64px" data-h>${b.label}</div>${b.rows.map((r, i) => `
    <div class="abs" style="left:300px;top:${420 + i * 190}px;font-size:40px;font-weight:600">${r[0]}</div>
    <div class="abs" style="left:300px;top:${475 + i * 190}px;height:80px;border-radius:40px;background:${i ? '#6E5F57' : 'linear-gradient(90deg,#E73B2B,#F89833)'}" data-bar="${i}"></div>
    <div class="abs big" style="top:${470 + i * 190}px;font-size:76px" data-v="${i}"></div>`).join('')}${SRC(b)}`;
  const bars = [...el.querySelectorAll('[data-bar]')]; const vals = [...el.querySelectorAll('[data-v]')]; const h = el.querySelector('[data-h]');
  return (t) => { const a = ENTER(b); vis(h, eo(p(t, a, a + .5))); b.rows.forEach((r, i) => { const k = eo(p(t, a + .3 + i * .3, a + 1.5 + i * .3)); const w = 1100 * (r[1] / max) * k; bars[i].style.width = `${Math.max(1, w)}px`; vals[i].style.left = `${330 + w}px`; vals[i].textContent = `${fmt(r[1] * k, 1)}${b.unit}`; }); };
};
B.donut = (el, b) => {
  const C = 2 * Math.PI * 170;
  el.innerHTML = `<svg class="abs" style="left:300px;top:250px" width="460" height="460"><circle cx="230" cy="230" r="170" stroke="rgba(255,255,255,.12)" stroke-width="54" fill="none"/><circle cx="230" cy="230" r="170" stroke="#F89833" stroke-width="54" fill="none" stroke-linecap="round" transform="rotate(-90 230 230)" stroke-dasharray="${C}" data-arc/></svg>
    <div class="abs big" style="left:300px;width:460px;top:405px;text-align:center;font-size:110px" data-n></div>
    <div class="abs label d" style="left:860px;top:360px;width:860px;font-size:62px;font-weight:700;line-height:1.12" data-l>${b.label}</div>${SRC(b)}`;
  const arc = el.querySelector('[data-arc]'); const n = el.querySelector('[data-n]'); const l = el.querySelector('[data-l]');
  return (t) => { const a = ENTER(b); const k = eo(p(t, a, a + 1.5)); arc.style.strokeDashoffset = C * (1 - (b.pct / 100) * k); n.textContent = `${Math.round(b.pct * k)}%`; vis(l, eo(p(t, a - .05, a + .25))); };
};
// Two bars from the data: FY22 grows to its value, then FY25 grows from 0 to
// its own value (it never passes through other numbers), then the change.
B.falling = (el, b) => {
  el.innerHTML = `<div class="abs label" style="left:0;right:0;top:150px;text-align:center;font-size:56px">${b.label}</div>
    <div class="abs" style="left:640px;bottom:260px;width:240px;border-radius:24px 24px 0 0;background:#6E5F57" data-a></div>
    <div class="abs" style="left:1040px;bottom:260px;width:240px;border-radius:24px 24px 0 0;background:linear-gradient(180deg,#F89833,#E73B2B)" data-b></div>
    <div class="abs big" style="left:600px;width:320px;text-align:center;font-size:58px" data-av></div>
    <div class="abs big" style="left:1000px;width:320px;text-align:center;font-size:58px" data-bv></div>
    <div class="abs" style="left:640px;width:240px;bottom:200px;text-align:center;font-size:34px;color:var(--soft)">${b.fromLabel}</div>
    <div class="abs" style="left:1040px;width:240px;bottom:200px;text-align:center;font-size:34px;color:var(--soft)">${b.toLabel}</div>
    <div class="abs big" style="left:1340px;top:420px;font-size:150px;color:#F89833" data-pct>${b.change < 0 ? '−' : '+'}${Math.abs(b.change)}%</div>${SRC(b)}`;
  const A = el.querySelector('[data-a]'); const Bb = el.querySelector('[data-b]'); const av = el.querySelector('[data-av]'); const bv = el.querySelector('[data-bv]'); const pc = el.querySelector('[data-pct]');
  const H = 440; const dec = (v) => (Number.isInteger(v) ? 0 : 1);
  return (t) => { const a = ENTER(b);
    const ka = eo(p(t, a, a + .5)); A.style.height = `${H * ka}px`; av.style.bottom = `${260 + H * ka + 12}px`; av.textContent = `${fmt(b.from * ka, dec(b.from))} ${b.unit}`; vis(av, ka > 0 ? 1 : 0);
    const kb = eo(p(t, a + .55, a + 1.1)); const hb = H * (b.to / b.from) * kb; Bb.style.height = `${hb}px`; bv.style.bottom = `${260 + hb + 12}px`; bv.textContent = `${fmt(b.to * kb, dec(b.to))} ${b.unit}`; vis(bv, kb > 0 ? 1 : 0);
    vis(pc, eo(p(t, a + 1.15, a + 1.45))); pc.style.transform = `scale(${.7 + .3 * back(p(t, a + 1.15, a + 1.7))})`; };
};
B.quote = (el, b) => {
  const words = b.text.split(' ');
  el.innerHTML = `<div class="abs d" style="left:150px;top:150px;font-size:300px;font-weight:700;color:#F89833;line-height:1">“</div>
    <div class="abs d" style="left:250px;top:300px;width:1420px;font-size:74px;font-weight:700;line-height:1.18" data-q>${words.map(w => `<span style="opacity:.15">${w} </span>`).join('')}</div>
    <div class="abs" style="left:250px;top:760px;font-size:42px;font-weight:600;color:#FFD9B0" data-w>— ${b.who}</div>
    ${b.original ? `<div class="src" style="top:850px;bottom:auto;left:250px;width:1420px;font-size:28px;line-height:1.3">“${b.original}”</div>` : ''}${SRC(b)}`;
  const spans = [...el.querySelectorAll('[data-q] span')]; const w = el.querySelector('[data-w]');
  // Words light up as they are spoken (the quote part of the line).
  return (t) => { const a = ENTER(b) + (b.end - b.start) * 0.18; const e = b.end - 0.5; spans.forEach((s, i) => { s.style.opacity = .15 + .85 * eo(p(t, a + (i / spans.length) * (e - a), a + (i / spans.length) * (e - a) + .25)); }); vis(w, eo(p(t, ENTER(b) + .3, ENTER(b) + .8))); };
};
B.recipe = (el, b) => {
  el.innerHTML = `
    <div class="card abs" style="left:170px;top:250px;width:500px;height:520px;padding:40px" data-c1>
      <div style="font-size:30px;letter-spacing:.14em;color:#F89833;font-weight:600">${S('ai', 'AI')}</div><div class="d" style="font-size:60px;font-weight:700">${S('recipe', 'The recipe')}</div>
      ${[1, 2, 3, 4].map(i => `<div style="margin-top:28px;display:flex;gap:16px;align-items:center"><span style="width:44px;height:44px;border-radius:50%;background:#F89833;color:var(--ink);display:grid;place-items:center;font-weight:700;font-size:26px">${i}</span><span style="height:16px;border-radius:8px;background:rgba(255,255,255,.3);width:${280 - i * 30}px"></span></div>`).join('')}
    </div>
    <div class="card abs" style="left:710px;top:250px;width:500px;height:520px;padding:40px" data-c2>
      <div style="font-size:30px;letter-spacing:.14em;color:#F89833;font-weight:600">${S('you', 'YOU')}</div><div class="d" style="font-size:60px;font-weight:700">${S('cook', 'Still cook')}</div>
      <svg viewBox="0 0 200 160" width="300" height="240" style="margin:40px 0 0 60px"><path d="M30 70 H170 V120 C170 140 150 150 130 150 H70 C50 150 30 140 30 120Z" fill="#E73B2B"/><rect x="18" y="62" width="164" height="14" rx="7" fill="#C4302A"/><path data-steam d="M80 50 C70 35 90 25 80 8 M110 50 C100 35 120 25 110 8" stroke="#FFD9B0" stroke-width="6" fill="none" stroke-linecap="round"/></svg>
    </div>

// QA: every text layer on screen in this frame, with its opacity, so the
// checks can find overlapping titles and text that leaves too soon.
const QA_ID = new WeakMap(); let qaNext = 1;
window.qaLayers = () => {
  const out = [];
  const opacityOf = (el) => { let o = 1; for (let e = el; e && e !== document.body; e = e.parentElement) { const cs = getComputedStyle(e); if (cs.visibility === 'hidden' || cs.display === 'none') return 0; o *= Number(cs.opacity); } return o; };
  for (const el of document.querySelectorAll('#beats .beat *, #sec, #sec *')) {
    if (el.closest('[data-q]') && !el.matches('[data-q]')) continue; // the quote is read as one layer
    const own = el.matches('[data-q]') ? el.textContent.trim() : [...el.childNodes].filter(n => n.nodeType === 3).map(n => n.textContent).join('').trim();
    if (!own || el.closest('.device .screen')) continue;
    const op = opacityOf(el); if (op < 0.05) continue;
    if (!QA_ID.has(el)) QA_ID.set(el, qaNext++);
    const size = parseFloat(getComputedStyle(el).fontSize);
    const inSec = !!el.closest('#sec');
    const kind = el.closest('.src') ? 'source' : el.matches('[data-q]') ? 'quote' : el.classList.contains('word') ? 'deco' : inSec ? (size > 70 ? 'title' : 'chip') : el.closest('.fill') ? 'fill' : size >= 70 ? 'title' : 'label';
    const beat = el.closest('.beat'); const group = inSec ? 'section' : String([...document.querySelectorAll('#beats .beat')].indexOf(beat));
    out.push({ id: QA_ID.get(el), kind, group, op: +op.toFixed(2), text: (el.closest('[data-n]') ? el.closest('[data-n]').textContent : el.textContent).trim().slice(0, 160), code: !!el.closest('[style*=monospace]') });
  }
  return out;
};

// Build every beat.
const built = BEATS.map((b) => { const el = document.createElement('div'); el.className = 'beat'; $('beats').appendChild(el); return { b, el, up: B[b.type](el, b) }; });

window.render = async function render(t) {
  const sec = sectionAt(t); const th = THEME[sec.theme] || THEME.dark;
  // Background: a quick cross-fade on each section change.
  $('bg').style.background = th.bg;
  document.body.style.color = th.ink;
  bubEls.forEach((el, i) => { const o = BUBS[i]; const y = ((o.y - t * o.v) % 1260 + 1260) % 1260 - 180;
    el.style.width = el.style.height = `${o.r}px`; el.style.background = th.bub[o.c];
    el.style.transform = `translate(${o.x + Math.sin(t * .5 + o.ph) * 40}px, ${y}px) scale(${1 + .08 * Math.sin(t + o.ph)})`; });
  // Beats: the current one, fading out over its last 0.35 s.
  for (const x of built) {
    const on = t >= x.b.start - 0.001 && t < x.b.end + 0.001;
    if (!on) { vis(x.el, 0); continue; }
    // A section's first beat waits until the section title has moved to the corner.
    const inn = TITLED(x.b) ? eo(p(t, ENTER(x.b) - .05, ENTER(x.b) + .25)) : 1;
    const out = (x.b.type === 'close' ? 1 : 1 - eio(p(t, x.b.end - .2, x.b.end))) * inn; // 0.2 s out, the next in at once: no blank frames
    vis(x.el, out);
    x.el.style.color = th.ink;
    x.el.querySelectorAll('.src').forEach(s => { s.style.color = th.ink; vis(s, .8 * eo(p(t, ENTER(x.b) - .05, ENTER(x.b) + .3))); }); // the source is up for the whole slide
    await x.up(t);
  }
  // Section title: big wipe-in at the start, then a chip at the top left.
  const secEl = $('sec'); const line = $('secLine');
  if (sec.title) {
    secEl.querySelector('.n').textContent = sec.n; secEl.querySelector('.t').textContent = sec.title;
    const a = sec.start; const big = eo(p(t, a, a + .45)); const shrink = eio(p(t, a + .95, a + 1.45));
    const fs = 150 - 104 * shrink;
    secEl.style.fontSize = `${fs}px`;
    const w = secEl.offsetWidth;
    const x = (960 - w / 2) * (1 - shrink) + 110 * shrink; const y = (440) * (1 - shrink) + 70 * shrink;
    secEl.style.transform = `translate(${x}px, ${y}px)`;
    secEl.style.clipPath = `inset(0 ${100 - 100 * big}% 0 0)`;
    secEl.style.color = th.ink; vis(secEl, 1);
    line.style.left = `${x}px`; line.style.top = `${y + fs * 1.25}px`; line.style.width = `${w * eo(p(t, a + .2, a + .7))}px`; vis(line, 1);
  } else { vis(secEl, 0); vis(line, 0); }
  // A slow camera push-in.
  $('stage').style.transform = `scale(${1 + .02 * clamp((t - sec.start) / 8)})`;
};

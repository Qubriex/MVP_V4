<!doctype html><html><head><meta charset="utf-8"><style>
  /* The vertical (9:16) and square (1:1) engine: the pitch videos' look (dark
     bokeh, orange accents, flame logo) laid out for the frame. Safe areas from
     the style guide: 9:16 text in the middle 80% width, clear of the top 12%
     and bottom 20%; 1:1 6% margins. Captions are burned in. */
  @font-face { font-family: Outfit; src: url('../../frontend/public/fonts/outfit-latin-600-normal.woff2'); font-weight: 600; }
  @font-face { font-family: Outfit; src: url('../../frontend/public/fonts/outfit-latin-700-normal.woff2'); font-weight: 700; }
  @font-face { font-family: Anek; src: url('../../frontend/public/fonts/anek-latin-latin-600-normal.woff2'); font-weight: 600; }
  * { box-sizing: border-box; }
  html, body { margin: 0; overflow: hidden; background: #15110F; }
  body { font-family: Anek, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
  #stage { position: absolute; left: 0; top: 0; overflow: hidden; }
  #bg { position: absolute; inset: 0; }
  body, .safe { color: var(--ink, #fff); }
  .bub { position: absolute; left: 0; top: 0; border-radius: 50%; filter: blur(2px); }
  .beat { position: absolute; inset: 0; visibility: hidden; }
  .safe { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: calc(var(--u) * 34px); }
  .d { font-family: Outfit, sans-serif; letter-spacing: -0.02em; text-wrap: balance; }
  .big { font-family: Outfit, sans-serif; font-weight: 700; font-size: calc(var(--u) * 92px); line-height: 1.05; }
  .mid { font-family: Outfit, sans-serif; font-weight: 700; font-size: calc(var(--u) * 60px); line-height: 1.12; }
  .lab { font-weight: 600; font-size: calc(var(--u) * 46px); line-height: 1.25; color: var(--soft); }
  .card { background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.16); border-radius: calc(var(--u) * 30px); }
  .code { font-family: ui-monospace, 'DejaVu Sans Mono', monospace; font-size: calc(var(--u) * 50px); line-height: 1.55; text-align: left; background: #1F1A17; border-radius: calc(var(--u) * 24px); padding: calc(var(--u) * 34px) calc(var(--u) * 40px); color: #F3E9E1; white-space: pre; }
  .op { padding: 0 .2em; border-radius: .2em; }
  .chip { display: inline-block; background: #fff; color: #E73B2B; font-family: Outfit, sans-serif; font-weight: 700; font-size: calc(var(--u) * 46px); padding: .3em .8em; border-radius: 999px; }
  .tag { font-size: calc(var(--u) * 30px); font-weight: 600; letter-spacing: .06em; color: #FFD9B0; background: rgba(248,152,51,.16); border: 1px solid rgba(248,152,51,.45); padding: .3em .9em; border-radius: 999px; }
  .fill { color: #1b1b1f; background: #FF8A00; border-radius: .25em; padding: 0 .25em; font-weight: 700; }
  .screen { position: relative; overflow: hidden; border-radius: calc(var(--u) * 24px); background: #fff; box-shadow: 0 30px 80px rgba(0,0,0,.45); }
  .screen img { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .badge { position: absolute; right: calc(var(--u) * 18px); top: calc(var(--u) * 18px); font-size: calc(var(--u) * 24px); font-weight: 700; letter-spacing: .08em; color: #FFD9B0; background: rgba(27,27,31,.85); padding: .3em .8em; border-radius: 999px; }
  #cap { position: absolute; left: 0; right: 0; text-align: center; font-weight: 600; line-height: 1.3; color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,.9); }
  #cap span { background: rgba(11,12,22,.72); padding: .12em .45em; border-radius: .3em; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
</style></head><body>
<div id="stage"><div id="bg"></div><div id="bubbles"></div><div id="beats"></div><div id="cap"></div></div>
<script>
const { beats: BEATS, total: TOTAL, footage: FOOTAGE, size: [W, H], captions: CAPS = [], captionSize = 52 } = window.STORY;
const U = W / 1080; document.documentElement.style.setProperty('--u', U);
const $ = (id) => document.getElementById(id);
$('stage').style.width = `${W}px`; $('stage').style.height = `${H}px`;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)); const p = (t, a, b) => clamp((t - a) / (b - a));
const eo = (x) => 1 - (1 - x) ** 3; const eio = (x) => (x < .5 ? 4 * x * x * x : 1 - (-2 * x + 2) ** 3 / 2);
const back = (x) => { const c = 1.6; return 1 + (c + 1) * (x - 1) ** 3 + c * (x - 1) ** 2; };
const vis = (el, o) => { el.style.opacity = o; el.style.visibility = o > 0.001 ? 'visible' : 'hidden'; };
const F = (s) => String(s ?? '').replace(/\[(FILL:[^\]]*|website)\]/g, (m) => `<span class="fill">${m}</span>`);
// Safe area: 9:16 → middle 80% width, y from 12% to 80%; 1:1 → 6% margins.
const TALL = H > W * 1.2;
const SAFE = TALL ? { x: W * .1, y: H * .12, w: W * .8, h: H * (CAPS.length ? .58 : .68) } : { x: W * .06, y: H * .06, w: W * .88, h: H * .88 - (CAPS.length ? H * .12 : 0) };
// Where burned-in captions start: callouts stay above this line.
const CAP_TOP = TALL ? H * .8 - captionSize * U * 2.9 : H * .94 - captionSize * U * 2.8;
const box = (el) => Object.assign(el.style, { left: `${SAFE.x}px`, top: `${SAFE.y}px`, width: `${SAFE.w}px`, height: `${SAFE.h}px` });
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const BGS = {
  A: { bg: 'radial-gradient(90% 60% at 92% 96%, rgba(242,106,33,.27), transparent 70%), radial-gradient(80% 50% at 6% 4%, rgba(200,40,30,.16), transparent 70%), #15110F', ink: '#FFFFFF', soft: '#FFE3C4' },
  B: { bg: 'radial-gradient(90% 60% at 92% 96%, rgba(242,106,33,.16), transparent 70%), #FBF6EF', ink: '#1F1A17', soft: '#6E5F57' },
  C: { bg: 'radial-gradient(90% 60% at 88% 94%, rgba(226,59,45,.32), transparent 70%), radial-gradient(80% 50% at 8% 6%, rgba(242,106,33,.14), transparent 70%), #1E0A09', ink: '#FFFFFF', soft: '#E8C9B8' }
};
const SEL = BGS[window.STORY.background || 'A'] || BGS.A;
$('bg').style.background = SEL.bg; document.documentElement.style.setProperty('--ink', SEL.ink); document.documentElement.style.setProperty('--soft', SEL.soft);
const BUBS = Array.from({ length: 0 }, (_, i) => ({ x: rnd() * W, y: rnd() * H, r: (40 + rnd() * 190) * U * 1.3, v: (10 + rnd() * 26) * U, ph: rnd() * 6, c: ['rgba(231,59,43,.22)', 'rgba(248,152,51,.18)', 'rgba(242,106,33,.14)'][i % 3] }));
BUBS.forEach(() => { const d = document.createElement('div'); d.className = 'bub'; $('bubbles').appendChild(d); });
const bubEls = [...document.querySelectorAll('.bub')];

const B = {};
const fade = (el, t, a, d = .35) => { vis(el, eo(p(t, a, a + d))); el.style.transform = `translateY(${(1 - eo(p(t, a, a + d + .1))) * 30 * U}px)`; };
// Lines of text: the first is the headline; an optional tag sits above.
B.text = (el, b) => {
  const s = document.createElement('div'); s.className = 'safe'; box(s); el.appendChild(s);
  s.innerHTML = `${b.tag ? `<span class="tag" data-i>${F(b.tag)}</span>` : ''}${(b.lines || []).map((l, i) => `<div class="${i === 0 ? 'big' : (b.small ? 'lab' : 'mid')} d" data-i style="${i && b.accent ? 'color:#F89833' : ''}">${F(l)}</div>`).join('')}${b.chips ? `<div data-i style="display:flex;gap:${20 * U}px;flex-wrap:wrap;justify-content:center">${b.chips.map(c => `<span class="chip">${c}</span>`).join('')}</div>` : ''}`;
  const items = [...s.querySelectorAll('[data-i]')];
  return (t) => { items.forEach((x, i) => fade(x, t, b.start + .1 + i * (b.stagger ?? .45))); };
};
// The code card: optional countdown, the bug flagged, fixed, ticked.
B.code = (el, b) => {
  const s = document.createElement('div'); s.className = 'safe'; box(s); el.appendChild(s);
  s.innerHTML = `${b.title ? `<div class="mid d" data-i>${F(b.title)}</div>` : ''}
    <div class="code" data-i>def add(a, b):\n    return a <span class="op" data-op>*</span> b</div>
    ${b.timer ? `<div class="big" style="font-size:${150 * U}px;color:#F89833" data-timer></div>` : ''}
    <div class="lab" style="color:#ff8a7a" data-bug>Bug: should be +</div>
    <svg viewBox="0 0 100 100" width="${150 * U}" height="${150 * U}" data-tick><circle cx="50" cy="50" r="46" fill="#2e9e6b"/><path d="M28 52 L44 68 L74 36" stroke="#fff" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  const items = [...s.querySelectorAll('[data-i]')]; const op = s.querySelector('[data-op]'); const bug = s.querySelector('[data-bug]'); const tick = s.querySelector('[data-tick]'); const timer = s.querySelector('[data-timer]');
  return (t) => {
    items.forEach((x, i) => fade(x, t, b.start + .05 + i * .3));
    if (timer) { const left = Math.ceil(clamp(b.timer - (t - b.start - .3), 0, b.timer)); timer.textContent = left > 0 ? left : ''; vis(timer, left > 0 ? 1 : 0); }
    const spot = b.spot ?? (b.end - b.start) * .25; const fix = Math.max(spot + 2.2, Math.min(b.fix ?? (b.end - b.start) * .62, (b.end - b.start) - 5.6)); // the fixed code stays ≥ 5 s
    const s1 = b.reveal !== false && t > b.start + spot; const s2 = b.reveal !== false && t > b.start + fix; // the countdown keeps the bug
    op.textContent = s2 ? '+' : '*'; op.style.background = s2 ? 'rgba(46,158,107,.4)' : s1 ? 'rgba(231,59,43,.6)' : 'transparent';
    vis(bug, b.reveal !== false && s1 && !s2 ? 1 : 0); vis(tick, b.reveal !== false && s2 ? 1 : 0); tick.style.transform = `scale(${back(p(t, b.start + fix, b.start + fix + .5))})`;
  };
};
// A product screen: the whole Qubirex page (never cropped) in a browser frame
// with 6% side margins; after a moment it dims to 35%, an orange outline marks
// the area being talked about, and a 2x callout of that area sits below it,
// joined by a thin line.
B.shot = (el, b) => {
  // The full page (never cropped), then the page dims, the measured element
  // gets an orange outline, and a callout shows exactly that element (its box
  // from the recorder, 16 px padding) at up to 2.2× the page. 9:16: page in
  // the top half, callout below. 1:1: a bigger page, the callout floating over
  // it, above or below the outlined element. Callouts stay above the captions.
  // Each shot brings its own title lines.
  const IW = 1440, IH = 900;
  const pw = TALL ? W * .88 : W * .8; const ph = pw * IH / IW; const bar = 30 * U;
  const lineH = b.shots.some(x => (x.lines || b.lines || []).length) ? 150 * U : 0;
  const top = SAFE.y;
  const px = (W - pw) / 2; const py = top + lineH + 20 * U + bar;
  const s0 = pw / IW;
  const floorY = CAPS.length ? CAP_TOP - 24 * U : SAFE.y + SAFE.h;
  el.innerHTML = `<div data-lines style="position:absolute;left:${SAFE.x}px;top:${top}px;width:${SAFE.w}px;text-align:center"></div>
    <div style="position:absolute;left:${px}px;top:${py - bar}px;width:${pw}px;height:${ph + bar}px;border-radius:${16 * U}px;background:#2a2421;box-shadow:0 30px 70px rgba(0,0,0,.45);overflow:hidden" data-qa-shot data-frame>
      <div style="height:${bar}px;display:flex;align-items:center;gap:${8 * U}px;padding-left:${14 * U}px"><i style="width:${10 * U}px;height:${10 * U}px;border-radius:50%;background:#E23B2D;display:block"></i><i style="width:${10 * U}px;height:${10 * U}px;border-radius:50%;background:#F26A21;display:block"></i><i style="width:${10 * U}px;height:${10 * U}px;border-radius:50%;background:#BEB4AC;display:block"></i><span style="margin-left:auto;margin-right:${12 * U}px;font-size:${18 * U}px;font-weight:700;letter-spacing:.08em;color:#FFD9B0">SAMPLE DATA</span></div>
      <div style="position:relative;width:${pw}px;height:${ph}px;overflow:hidden;background:#fff"><img data-img style="position:absolute;left:0;top:0;width:${pw}px;height:${ph}px"><div data-hl style="position:absolute;box-sizing:border-box;border:${4 * U}px solid #F26A21;border-radius:${6 * U}px;box-shadow:0 0 0 3000px rgba(21,17,15,.65)"></div></div></div>
    <svg style="position:absolute;left:0;top:0;overflow:visible" width="${W}" height="${H}"><line data-ln stroke="#F26A21" stroke-width="${3 * U}" stroke-dasharray="6 6"/></svg>
    <div style="position:absolute;box-sizing:border-box;border-radius:${14 * U}px;border:${4 * U}px solid #F26A21;background:#fff;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.55)" data-qa-shot data-qa-call data-call><img data-cimg style="position:absolute;left:0;top:0;transform-origin:0 0"></div>`;
  const img = el.querySelector('[data-img]'); const cimg = el.querySelector('[data-cimg]'); const hl = el.querySelector('[data-hl]'); const ln = el.querySelector('[data-ln]');
  const frame = el.querySelector('[data-frame]'); const call = el.querySelector('[data-call]'); const linesEl = el.querySelector('[data-lines]');
  return async (t) => {
    const sh0 = b.shots.find(x => t >= x.start && t < x.end) || b.shots[t < b.shots[0].start ? 0 : b.shots.length - 1];
    const L = sh0.lines || b.lines || []; const key = L.join('|');
    if (linesEl.dataset.k !== key) { linesEl.innerHTML = L.map((l, i) => `<div class="${i ? 'lab' : 'mid'} d" data-i>${F(l)}</div>`).join(''); linesEl.dataset.k = key; }
    [...linesEl.children].forEach((x, i) => fade(x, t, sh0.start + .05 + i * .3));
    const src = `${FOOTAGE}/${sh0.still || `${sh0.key}.png`}`;
    if (img.getAttribute('src') !== src) { img.src = src; cimg.src = src; await Promise.all([img.decode().catch(() => {}), cimg.decode().catch(() => {})]); }
    const local = t - sh0.start;
    const enter = eo(p(t, b.start, b.start + .35)); vis(frame, enter);
    const [fl, ft, fr, fb] = (sh0.focus || [0.25, 0.25, 0.75, 0.75]).map((v, i) => v * (i % 2 ? IH : IW));
    const fw = fr - fl; const fh = fb - ft; const B = 4 * U;
    const R = { l: px + fl * s0, t: py + ft * s0, r: px + fr * s0, b: py + fb * s0 };
    let cs, cw, chh, cx, cyy;
    if (TALL) {
      const areaTop = py + ph + 36 * U;
      cs = Math.min(2.2 * s0, (SAFE.w - 2 * B) / fw, (floorY - areaTop - 2 * B) / fh);
      cw = fw * cs + 2 * B; chh = fh * cs + 2 * B; cx = (W - cw) / 2; cyy = areaTop + Math.max(0, (floorY - areaTop - chh) / 2);
    } else {
      const ceil = top + lineH; const room = Math.max(R.t - 20 * U - ceil, floorY - (R.b + 20 * U));
      cs = Math.min(2.2 * s0, (SAFE.w - 2 * B) / fw, (Math.max(room, (floorY - ceil) * .55) - 2 * B) / fh);
      cw = fw * cs + 2 * B; chh = fh * cs + 2 * B;
      const below = floorY - (R.b + 20 * U); const above = R.t - 20 * U - ceil;
      cyy = below >= chh ? R.b + 20 * U : above >= chh ? R.t - 20 * U - chh : (below >= above ? floorY - chh : ceil);
      cyy = clamp(cyy, ceil, floorY - chh); cx = clamp((R.l + R.r) / 2 - cw / 2, SAFE.x, SAFE.x + SAFE.w - cw);
    }
    Object.assign(call.style, { left: `${cx}px`, top: `${cyy}px`, width: `${cw}px`, height: `${chh}px` }); call.dataset.mag = (cs / s0).toFixed(2);
    Object.assign(hl.style, { left: `${fl * s0 - B}px`, top: `${ft * s0 - B}px`, width: `${fw * s0 + 2 * B}px`, height: `${fh * s0 + 2 * B}px` });
    const on = eo(p(local, .6, .95)) * enter; vis(hl, on); vis(call, on); vis(ln, on);
    cimg.style.width = `${IW}px`; cimg.style.height = `${IH}px`; cimg.style.transform = `translate(${-fl * cs}px, ${-ft * cs}px) scale(${cs})`;
    const up = cyy + chh / 2 < (R.t + R.b) / 2;
    ln.setAttribute('x1', (R.l + R.r) / 2); ln.setAttribute('y1', up ? R.t : R.b); ln.setAttribute('x2', clamp((R.l + R.r) / 2, cx + 20, cx + cw - 20)); ln.setAttribute('y2', up ? cyy + chh : cyy);
  };
};
// QA: the caption's box while it shows (callouts must not overlap it).
window.qaCap = () => { const c = document.getElementById('cap'); if (!c || !c.textContent.trim() || Number(getComputedStyle(c).opacity) < .05 || getComputedStyle(c).visibility === 'hidden') return null; const k = c.firstElementChild || c; const r = k.getBoundingClientRect(); return r.width > 2 ? [r.left, r.top, r.right, r.bottom] : null; };
window.qaCalls = () => [...document.querySelectorAll('.beat [data-qa-call]')].filter(e => getComputedStyle(e.closest('.beat')).visibility !== 'hidden' && Number(getComputedStyle(e).opacity) > .05).map(e => { const r = e.getBoundingClientRect(); return [r.left, r.top, r.right, r.bottom, Number(e.dataset.mag || 0)]; });
window.qaBoxes = () => [...document.querySelectorAll('.beat [data-qa-shot]')].filter(e => getComputedStyle(e.closest('.beat')).visibility !== 'hidden' && Number(getComputedStyle(e).opacity) > .05).map(e => { const r = e.getBoundingClientRect(); return [r.left, r.top, r.right, r.bottom]; });
// Split screen: the dense English lecture (top), then Professor Qubirex (bottom).
B.split = (el, b) => {
  const s = document.createElement('div'); s.className = 'safe'; box(s); el.appendChild(s);
  s.style.justifyContent = 'space-between';
  s.innerHTML = `<div class="card" style="width:100%;padding:${40 * U}px;opacity:.95" data-top><div class="tag" style="display:inline-block;margin-bottom:${24 * U}px">English lecture</div><div style="font-size:${44 * U}px;line-height:1.35;color:#BEB4AC;font-family:Georgia,serif">A function returns a value to its caller upon completion of execution.</div></div>
    <div class="card" style="width:100%;padding:${40 * U}px;border-color:rgba(248,152,51,.6)" data-bot><div class="tag" style="display:inline-block;margin-bottom:${24 * U}px">Professor Qubirex</div><div class="code" style="font-size:${46 * U}px">def total(price, qty):\n    <span class="op" style="background:rgba(248,152,51,.45)">return</span> price * qty</div></div>`;
  const top = s.querySelector('[data-top]'); const bot = s.querySelector('[data-bot]');
  return (t) => { fade(top, t, b.start + .1); top.style.filter = t > b.mid ? 'grayscale(1) brightness(.6)' : 'none'; fade(bot, t, b.mid); };
};
// Three icons with words.
const ICONS = {
  signed: '<svg viewBox="0 0 100 100"><path d="M50 8 L86 22 V50 C86 72 70 86 50 94 C30 86 14 72 14 50 V22Z" fill="#E73B2B"/><path d="M34 52 L46 64 L68 40" stroke="#fff" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  fresh: '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="38" fill="none" stroke="#F89833" stroke-width="12"/><path d="M50 26 V52 L66 62" stroke="#F89833" stroke-width="10" fill="none" stroke-linecap="round"/></svg>',
  verify: '<svg viewBox="0 0 100 100"><rect x="12" y="12" width="32" height="32" rx="4" fill="#BC1F3D"/><rect x="56" y="12" width="32" height="32" rx="4" fill="#BC1F3D"/><rect x="12" y="56" width="32" height="32" rx="4" fill="#BC1F3D"/><circle cx="72" cy="72" r="16" fill="#2e9e6b"/><path d="M64 72 L70 78 L80 66" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/></svg>'
};
B.icons = (el, b) => {
  const s = document.createElement('div'); s.className = 'safe'; box(s); el.appendChild(s);
  s.innerHTML = b.items.map(([ic, w]) => `<div data-i style="display:flex;align-items:center;gap:${30 * U}px;width:100%"><span style="width:${120 * U}px;height:${120 * U}px;flex:none">${ICONS[ic]}</span><span class="mid d" style="text-align:left">${F(w)}</span></div>`).join('');
  const items = [...s.querySelectorAll('[data-i]')];
  return (t) => items.forEach((x, i) => fade(x, t, b.start + .1 + i * Math.min(1.2, (b.end - b.start) * .2)));
};
// A pile of résumés falling in, under the headline.
// A sample resume for the "2,000 resumes" pile: invented people, fixed per card
// (the same card always shows the same data). k = scale (1 = a 260 px wide card).
const RESUME = (() => {
  const N = ['Ravi Teja', 'Sneha Reddy', 'Arjun Varma', 'Priya Naidu', 'Kiran Kumar', 'Anusha Rao', 'Sai Charan', 'Divya Sree', 'Rahul Goud', 'Meghana K', 'Vamsi Krishna', 'Lavanya P', 'Harsha V', 'Keerthi S', 'Manoj B', 'Swathi M', 'Nikhil R', 'Bhavana T'];
  const DEG = ['B.Tech CSE', 'B.Tech IT', 'B.Tech ECE', 'B.Tech CSE (AI)', 'B.Tech EEE', 'MCA'];
  const SK = ['Python', 'Java', 'C', 'SQL', 'HTML/CSS', 'JavaScript', 'React', 'Git', 'DSA', 'Excel', 'Node.js', 'C++'];
  const PR = ['Library management app', 'Attendance tracker', 'Weather dashboard', 'Online quiz portal', 'Expense splitter', 'Chat app (sockets)', 'Hostel room booking', 'Portfolio website', 'Bus pass system', 'Movie ticket clone'];
  const CE = ['NPTEL: Python for Data Science', 'Coursera: SQL Basics', 'HackerRank: Java (Basic)', 'NPTEL: Data Structures', 'AWS Cloud Practitioner (in progress)'];
  const IN = ['Intern, local startup (2 months)', 'NSS volunteer', 'Hackathon finalist', 'Web dev workshop', 'NPTEL: Java (Elite)', 'Coding club member'];
  return (i, k = 1) => {
    const px = (v) => `${(v * k).toFixed(1)}px`;
    const skills = [0, 1, 2, 3].map(j => SK[(i * 5 + j * 3) % SK.length]);

const built = BEATS.map((b) => { const el = document.createElement('div'); el.className = 'beat'; $('beats').appendChild(el); return { b, el, up: B[b.type](el, b) }; });
const cap = $('cap');
Object.assign(cap.style, { top: `${CAP_TOP}px`, padding: `0 ${W * (TALL ? .1 : .06)}px`, fontSize: `${captionSize * U}px` });

const QA_ID = new WeakMap(); let qaNext = 1;
window.qaLayers = () => {
  const out = [];
  const opacityOf = (el) => { let o = 1; for (let e = el; e && e !== document.body; e = e.parentElement) { const cs = getComputedStyle(e); if (cs.visibility === 'hidden' || cs.display === 'none') return 0; o *= Number(cs.opacity); } return o; };
  for (const el of document.querySelectorAll('#beats .beat *, #cap span')) {
    const own = [...el.childNodes].filter(n => n.nodeType === 3).map(n => n.textContent).join('').trim();
    if (!own || el.closest('.screen')) continue;
    const op = opacityOf(el); if (op < 0.05) continue;
    if (!QA_ID.has(el)) QA_ID.set(el, qaNext++);
    const isCap = !!el.closest('#cap');
    const big = el.classList.contains('big');
    const beat = el.closest('.beat'); const group = isCap ? 'caption' : String([...document.querySelectorAll('#beats .beat')].indexOf(beat));
    out.push({ id: isCap ? 'cap:' + el.textContent : QA_ID.get(el), kind: isCap ? 'caption' : el.closest('.fill') ? 'fill' : big ? 'title' : 'label', group, op: +op.toFixed(2), text: el.textContent.trim().slice(0, 160), code: !!el.closest('.code') });
  }
  return out;
};

window.render = async function render(t) {
  bubEls.forEach((el, i) => { const o = BUBS[i]; const y = ((o.y - t * o.v) % (H + 360) + H + 360) % (H + 360) - 180;
    el.style.width = el.style.height = `${o.r}px`; el.style.background = o.c; el.style.transform = `translate(${o.x + Math.sin(t * .5 + o.ph) * 40}px, ${y}px)`; });
  for (const x of built) {
    const on = t >= x.b.start - 0.001 && t < x.b.end + 0.001;
    if (!on) { vis(x.el, 0); continue; }
    vis(x.el, x.b.last ? 1 : 1 - eio(p(t, x.b.end - .2, x.b.end)));
    await x.up(t);
  }
  const c = CAPS.find(k => t >= k.start && t < k.end);
  const txt = c ? c.text : '';
  if (cap.dataset.t !== txt) { cap.innerHTML = txt ? `<span>${txt.replace(/\n/g, '<br>')}</span>` : ''; cap.dataset.t = txt; }
};
